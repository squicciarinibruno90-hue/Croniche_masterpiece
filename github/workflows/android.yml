name: Build Cronache APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Cronache
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Verify project structure
        run: |
          echo "=== Repository root ==="
          ls -la

          echo "=== Gradle files ==="
          find . -maxdepth 3 \
            -name "settings.gradle*" \
            -o -name "build.gradle*" \
            -o -name "gradle.properties" \
            -print

          test -f settings.gradle.kts || {
            echo "ERROR: settings.gradle.kts not found in repository root"
            exit 1
          }

          test -f app/build.gradle.kts || {
            echo "ERROR: app/build.gradle.kts not found"
            exit 1
          }

      - name: Download whisper.cpp
        run: |
          mkdir -p third_party
          rm -rf third_party/whisper.cpp

          git clone \
            --depth 1 \
            --branch v1.7.6 \
            https://github.com/ggerganov/whisper.cpp.git \
            third_party/whisper.cpp

          echo "=== whisper.cpp ==="
          git -C third_party/whisper.cpp rev-parse HEAD
          ls -la third_party/whisper.cpp

      - name: Configure
